<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WAGYU AI</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:#f4f9fc">
<div id="root"></div>
<script>
const { useState, useMemo, useRef, useEffect, useCallback } = React;

const SUPABASE_URL = 'https://icfvocxiiclmcmjcdmzp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XrHVjSfQvJ3_9BzoFo911g_n78afVX-';
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

window.getFarmId = function() {
  try {
    const s = localStorage.getItem('wagyu_settings');
    const settings = s ? JSON.parse(s) : {};
    return settings.farmId || 'default';
  } catch(e) { return 'default'; }
};

window.saveCow = async function(cow) {
  if(!sb) return;
  const farmId = window.getFarmId();
  try {
    await sb.from('cattle_records').upsert({
      id: cow.id, farm_id: farmId, data: cow,
      updated_at: new Date().toISOString()
    });
  } catch(e) { console.log('保存エラー:', e); }
};

// 一括保存（100頭ずつ）
window.saveCattleBatch = async function(cattleArr) {
  if(!sb || !Array.isArray(cattleArr) || cattleArr.length===0) return;
  const farmId = window.getFarmId();
  const batchSize = 100;
  for(let i=0; i<cattleArr.length; i+=batchSize) {
    const batch = cattleArr.slice(i, i+batchSize).map(cow=>({
      id: cow.id,
      farm_id: farmId,
      data: cow,
      updated_at: new Date().toISOString()
    }));
    try {
      await sb.from('cattle_records').upsert(batch);
    } catch(e) { console.log(`一括保存エラー(${i}〜):`, e); }
  }
};

window.deleteCowRemote = async function(id) {
  if(!sb) return;
  try { await sb.from('cattle_records').delete().eq('id', id); } catch(e) {}
};

// 一括保存（100頭ずつ・IDごとに微妙に異なる時刻）
window.saveCattleBatch = async function(cattleArr) {
  if(!sb || !Array.isArray(cattleArr) || cattleArr.length===0) return;
  const farmId = window.getFarmId();
  const batchSize = 100;
  const baseTime = Date.now();
  for(let i=0; i<cattleArr.length; i+=batchSize) {
    const batch = cattleArr.slice(i, i+batchSize).map((cow, j)=>({
      id: cow.id,
      farm_id: farmId,
      data: cow,
      updated_at: new Date(baseTime + i + j).toISOString() // 微妙にずらしてページネーション崩壊防止
    }));
    try {
      await sb.from('cattle_records').upsert(batch);
    } catch(e) { console.log(`一括保存エラー(${i}〜):`, e); }
  }
};

window.loadAllCattle = async function() {
  if(!sb) return null;
  const farmId = window.getFarmId();
  try {
    // id順で安定したページネーション
    let all = [];
    let from = 0;
    const limit = 1000;
    while(true) {
      const { data, error } = await sb
        .from('cattle_records')
        .select('data')
        .eq('farm_id', farmId)
        .order('id', { ascending: true })
        .range(from, from + limit - 1);
      if(error) throw error;
      if(!data || data.length === 0) break;
      all = all.concat(data.map(r => r.data));
      if(data.length < limit) break;
      from += limit;
    }
    return all;
  } catch(e) { console.log('読み込みエラー:', e); return null; }
};

async function main() {
  const res = await fetch('./wagyu-ai-v4.jsx');
  if(!res.ok) throw new Error('ファイル読み込み失敗: ' + res.status);
  let code = await res.text();
  code = code
    .replace(/import \* as XLSX from ['"]xlsx['"];?/g, '')
    .replace(/import \{[^}]+\} from ['"]react['"];?/g, '')
    .replace(/export default function App/g, 'window.App = function App');
  let result;
  try { result = Babel.transform(code, { presets: ['react'] }); }
  catch(e) { throw new Error('Babel変換エラー: ' + e.message); }
  const fn = new Function('React','ReactDOM','XLSX','useState','useMemo','useRef','useEffect','useCallback', result.code);
  fn(React, ReactDOM, XLSX, useState, useMemo, useRef, useEffect, useCallback);
  if(!window.App) throw new Error('App関数が見つかりません');
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.App));
}

main().catch(e => {
  document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif"><div style="color:#e86060;font-weight:bold;font-size:16px;margin-bottom:12px">起動エラー</div><div style="background:#fdeaea;border-radius:8px;padding:12px;font-size:13px;word-break:break-all;color:#c0392b">' + e.message + '</div><button onclick="location.reload()" style="margin-top:12px;background:#4ab8e8;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer">再読み込み</button></div>';
});
</script>
</body>
</html>
