<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WAGYU AI</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:#f4f9fc">
<div id="root"></div>
<script>
const { useState, useMemo, useRef, useEffect, useCallback } = React;

const SUPABASE_URL = 'https://icfvocxiiclmcmjcdmzp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XrHVjSfQvJ3_9BzoFo911g_n78afVX-';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function saveCattle(data) {
  await sb.from('cattle_data').upsert({ user_id:'default', data, updated_at: new Date().toISOString() });
}
async function loadCattle() {
  const { data } = await sb.from('cattle_data').select('data').eq('user_id','default').single();
  return data?.data || null;
}

async function main() {
  const res = await fetch('./wagyu-ai-v4.jsx');
  let code = await res.text();
  code = code
    .replace(/import \* as XLSX from ['"]xlsx['"];?/g, '')
    .replace(/import \{[^}]+\} from ['"]react['"];?/g, '')
    .replace(/export default function App/g, 'window.App = function App');
  const result = Babel.transform(code, { presets: ['react'] });
  const fn = new Function(
    'React','ReactDOM','XLSX',
    'useState','useMemo','useRef','useEffect','useCallback',
    'saveCattle','loadCattle',
    result.code
  );
  fn(React,ReactDOM,XLSX,
    useState,useMemo,useRef,useEffect,useCallback,
    saveCattle,loadCattle
  );
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.App)
  );
}
main().catch(e=>{
  document.body.innerHTML='<div style="padding:20px;color:red">エラー: '+e.message+'</div>';
});
</script>
</body>
</html>
