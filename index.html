<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WAGYU AI</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body style="margin:0;padding:0;background:#f4f9fc">
<div id="root"></div>
<script>
fetch('wagyu-ai-v4.jsx')
  .then(r => r.text())
  .then(code => {
    const cleaned = code
      .replace(/^import.*from.*$/gm, '')
      .replace(/^export default /m, 'const App = ');
    const script = document.createElement('script');
    script.type = 'text/babel';
    script.text = cleaned + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));';
    document.body.appendChild(script);
    Babel.transformScriptTags();
  });
</script>
</body>
</html>
