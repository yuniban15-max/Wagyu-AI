<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WAGYU AI</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:#f4f9fc">
<div id="root"></div>
<script>
const { useState, useMemo, useRef, useEffect, useCallback } = React;

const SUPABASE_URL = 'https://icfvocxiiclmcmjcdmzp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XrHVjSfQvJ3_9BzoFo911g_n78afVX-';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 現在のユーザーID
window.getCurrentUserId = async function() {
  const { data: { user } } = await sb.auth.getUser();
  return user?.id || null;
};

// 保存
window.saveCattle = async function(data) {
  const userId = await window.getCurrentUserId();
  const key = userId || 'default';
  try { localStorage.setItem('wagyu_cattle_' + key, JSON.stringify(data)); } catch(e) {}
  if(!userId) return;
  try {
    await sb.from('cattle_data').delete().eq('user_id', userId);
    await sb.from('cattle_data').insert({ user_id: userId, data, updated_at: new Date().toISOString() });
  } catch(e) { console.log('保存エラー:', e); }
};

// 読み込み
window.loadCattle = async function() {
  const userId = await window.getCurrentUserId();
  const key = userId || 'default';
  if(userId) {
    try {
      const { data } = await sb.from('cattle_data').select('data').eq('user_id', userId).single();
      if(data?.data) {
        localStorage.setItem('wagyu_cattle_' + key, JSON.stringify(data.data));
        return data.data;
      }
    } catch(e) {}
  }
  try {
    const local = localStorage.getItem('wagyu_cattle_' + key);
    return local ? JSON.parse(local) : null;
  } catch(e) { return null; }
};

// ログイン
window.signIn = async function(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
  return data.user;
};

// 新規登録
window.signUp = async function(email, password) {
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error) throw error;
  return data.user;
};

// ログアウト
window.signOut = async function() {
  await sb.auth.signOut();
  localStorage.clear();
  location.reload();
};

// 認証状態を取得
window.getUser = async function() {
  const { data: { user } } = await sb.auth.getUser();
  return user;
};

async function main() {
  const res = await fetch('./wagyu-ai-v4.jsx');
  let code = await res.text();
  code = code
    .replace(/import \* as XLSX from ['"]xlsx['"];?/g, '')
    .replace(/import \{[^}]+\} from ['"]react['"];?/g, '')
    .replace(/export default function App/g, 'window.App = function App');
  const result = Babel.transform(code, { presets: ['react'] });
  const fn = new Function(
    'React','ReactDOM','XLSX',
    'useState','useMemo','useRef','useEffect','useCallback',
    result.code
  );
  fn(React,ReactDOM,XLSX,useState,useMemo,useRef,useEffect,useCallback);
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.App)
  );
}
main().catch(e=>{
  document.body.innerHTML='<div style="padding:20px;color:red;font-size:14px">エラー: '+e.message+'</div>';
});
</script>
</body>
</html>
