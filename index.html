<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WAGYU AI</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const { useState, useMemo, useRef, useEffect, useCallback } = React;

// Supabase初期化（sb_publishable_XrHVjSfQvJ3_9BzoFo911g_n78afVX-）
// ※公開キーなので問題なし
const SUPABASE_URL = 'https://icfvocxiiclmcmjcdmzp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XrHVjSfQvJ3_9BzoFo911g_n78afVX-';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// データ保存
async function saveCattle(data) {
  const { error } = await supabase
    .from('cattle_data')
    .upsert({ user_id: 'default', data: data, updated_at: new Date().toISOString() });
  if (error) console.error('保存エラー:', error);
}

// データ読み込み
async function loadCattle() {
  const { data, error } = await supabase
    .from('cattle_data')
    .select('data')
    .eq('user_id', 'default')
    .single();
  if (error) return null;
  return data?.data;
}
</script>
</head>
<body style="margin:0;background:#f4f9fc">
<div id="root"></div>
<script>
async function main() {
  const res = await fetch('./wagyu-ai-v4.jsx');
  let code = await res.text();
  code = code
    .replace(/import \* as XLSX from ['"]xlsx['"];?/g, '')
    .replace(/import \{[^}]+\} from ['"]react['"];?/g, '')
    .replace(/export default function App/g, 'window.App = function App');
  const result = Babel.transform(code, { presets: ['react'] });
  const fn = new Function(
    'React','ReactDOM','XLSX',
    'useState','useMemo','useRef','useEffect','useCallback',
    result.code
  );
  fn(React, ReactDOM, XLSX, useState, useMemo, useRef, useEffect, useCallback);
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.App)
  );
}
main().catch(e => {
  document.body.innerHTML = '<div style="padding:20px;color:red;font-size:14px">エラー: ' + e.message + '</div>';
});
</script>
</body>
</html>
